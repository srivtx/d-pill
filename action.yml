name: 'd-pill critique'
description: 'The d-pill design gate. Checks HTML/CSS against the d-pill token scales (space, ramp, radius, duration, z) and access floors, with file:line:col findings.'
author: 'srivtx'
inputs:
  paths:
    description: 'Comma-separated files or directories to check.'
    required: false
    default: '.'
  allow:
    description: 'Comma-separated rule ids to suppress. A suppression is a written exception.'
    required: false
    default: ''
  strict:
    description: "'true' to fail on warnings too."
    required: false
    default: 'false'
branding:
  icon: 'check-circle'
  color: 'gray-dark'
runs:
  using: 'composite'
  steps:
    - name: 'Run the d-pill gate'
      shell: bash
      env:
        # Inputs enter through the environment, never through string
        # interpolation into the script — caller data stays data.
        INPUT_PATHS: ${{ inputs.paths }}
        INPUT_ALLOW: ${{ inputs.allow }}
        INPUT_STRICT: ${{ inputs.strict }}
      run: |
        set -e
        GATE="${{ github.action_path }}/scripts/critique.py"
        ARGS=()
        if [ -n "$INPUT_ALLOW" ]; then
          OLDIFS="$IFS"; IFS=','
          for rule in $INPUT_ALLOW; do
            [ -n "$rule" ] && ARGS+=(--allow "$(echo "$rule" | xargs)")
          done
          IFS="$OLDIFS"
        fi
        if [ "$INPUT_STRICT" = "true" ]; then
          ARGS+=(--strict)
        fi
        OLDIFS="$IFS"; IFS=','
        for p in $INPUT_PATHS; do
          [ -n "$p" ] && ARGS+=("$(echo "$p" | xargs)")
        done
        IFS="$OLDIFS"
        python3 "$GATE" "${ARGS[@]}"
