name: gate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: The token export is true
        run: python3 scripts/check-tokens.py

      - name: The rule registry agrees with the engine
        run: python3 scripts/critique.py --list-rules

      - name: Every rule fires where it should
        run: python3 scripts/critique.py --selftest

      - name: The demo passes its own gate
        run: python3 scripts/critique.py docs/index.html

      - name: The law passes its own scales
        run: python3 scripts/critique.py docs/base.css

      - name: The demo stylesheet has not drifted from the authority
        run: diff -q docs/base.css references/base.css

      - name: The machine exports parse as JSON
        run: |
          python3 -c "import json,pathlib; json.loads(pathlib.Path('references/tokens.json').read_text()); json.loads(pathlib.Path('references/rules.json').read_text()); print('exports parse')"
