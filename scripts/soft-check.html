<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>soft editorial — recipe check</title>
<link rel="stylesheet" href="../references/base.css">
<style>
/* ===== soft.md override, pasted verbatim ===== */
:root {
  --font-display: "Instrument Serif", Georgia, serif;
  --font-text: "Space Grotesk", "Instrument Sans", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", "IBM Plex Mono", ui-monospace, monospace;
  --radius-lg: 16px;
  --soft-lift:
    0 1px 2px oklch(0.25 0.02 var(--hue) / 0.05),
    0 8px 24px oklch(0.25 0.02 var(--hue) / 0.05);
  --soft-lift-hover:
    0 1px 2px oklch(0.25 0.02 var(--hue) / 0.06),
    0 12px 32px oklch(0.25 0.02 var(--hue) / 0.08);
}
html[data-theme="dark"] {
  --soft-lift: 0 8px 24px oklch(0.05 0.01 var(--hue) / 0.35);
  --soft-lift-hover: 0 12px 32px oklch(0.05 0.01 var(--hue) / 0.45);
}
.card-soft {
  background: var(--surface);
  border: var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--soft-lift);
  transition:
    box-shadow var(--dur-1) var(--ease-out),
    border-color var(--dur-1) var(--ease-out);
}
.card-soft:hover { box-shadow: var(--soft-lift-hover); }
.quote {
  font-family: var(--font-display);
  font-style: italic;
  font-size: var(--text-2xl);
  line-height: 1.1;
  max-width: 28ch;
}
.rule-dashed { border: 0; border-top: 1px dashed var(--line-strong); }
.strip {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr));
  gap: var(--space-3);
  align-items: stretch;
}
.strip .card-soft { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3); }
.tile {
  flex: none;
  width: 4rem; height: 4rem;
  border-radius: var(--radius);
  overflow: hidden;
  border: var(--border);
  background: var(--bg-subtle);
}
.dot-live { position: relative; width: 6px; height: 6px; border-radius: var(--radius-full); background: var(--ok); }
.dot-live::after {
  content: ""; position: absolute; inset: 0; border-radius: inherit;
  background: var(--ok);
  animation: ping 2s var(--ease-out) infinite;
}
@keyframes ping { from { transform: scale(1); opacity: 0.6; } to { transform: scale(2.4); opacity: 0; } }
.eq { display: flex; gap: 3px; height: 14px; align-items: flex-end; }
.eq span { width: 3px; border-radius: 1px; background: var(--ok); animation: eq 1s ease-in-out infinite; }
.eq span:nth-child(2) { animation-delay: 0.15s; }
.eq span:nth-child(3) { animation-delay: 0.3s; }
.eq span:nth-child(4) { animation-delay: 0.45s; }
.eq[data-idle] span { animation-play-state: paused; }
@keyframes eq { 0%, 100% { height: 30%; } 50% { height: 100%; } }
.js .reveal { opacity: 0; transform: translateY(8px); }
.reveal.in { opacity: 1; transform: none; }
.reveal { transition: opacity var(--dur-3) var(--ease-out), transform var(--dur-3) var(--ease-out); }
.media { overflow: hidden; border-radius: var(--radius-lg); }
.media img, .media video { transition: transform var(--dur-2) var(--ease-out); }
.media:hover img, .media:hover video { transform: scale(1.05); }
.marquee { overflow: hidden; }
.marquee ul { display: flex; gap: var(--space-4); width: max-content; animation: marquee 48s linear infinite; }
.marquee:hover ul { animation-play-state: paused; }
@keyframes marquee { to { transform: translateX(-50%); } }

/* ===== demo page wiring ===== */
.banner { background: oklch(0.25 0.04 250); color: oklch(0.95 0.01 250); padding: var(--space-7) var(--space-5); }
.demo { max-width: 46rem; margin: 0 auto; padding: var(--space-6) var(--space-4) var(--space-9); }
label { font-family: var(--font-mono); font-size: var(--text-xs); letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-muted); }
.glyph { width: 4rem; height: 4rem; display: grid; place-items: center; background: linear-gradient(135deg, oklch(0.93 0.03 215), oklch(0.88 0.05 215)); color: oklch(0.3 0.03 215); }
html[data-theme="dark"] .glyph { background: linear-gradient(135deg, oklch(0.4 0.07 215), oklch(0.3 0.06 215)); color: oklch(0.95 0.01 215); }
</style>
</head>
<body>
<a class="skip" href="#main">skip</a>
<div class="banner">
  <div class="demo">
    <p class="quote">the interface is quiet, and the quiet is the design.</p>
  </div>
</div>
<main class="demo" id="main">
  <p><label>status strip</label></p>
  <div class="strip reveal">
    <div class="card-soft">
      <span class="tile glyph" aria-hidden="true">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="7" r="2"/><circle cx="17" cy="17" r="2"/><path d="M9 7h6M7 9v6M17 15V9"/></svg>
      </span>
      <div style="min-width:0">
        <p><label>last played</label></p>
        <p style="font-weight:600">cold/mess</p>
        <p class="quiet">Prateek Kuhad</p>
      </div>
      <div class="eq" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
    </div>
    <div class="card-soft">
      <span class="tile glyph" aria-hidden="true">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M8 3l4 3 4-3"/></svg>
      </span>
      <div style="min-width:0">
        <p><label><span class="dot-live" style="display:inline-block;vertical-align:middle;margin-inline-end:4px"></span>now watching</label></p>
        <p style="font-weight:600">Rick and Morty</p>
        <p class="quiet">season 2</p>
      </div>
    </div>
  </div>
  <hr class="rule-dashed" style="margin-block:var(--space-6)">
  <p><label>cards</label></p>
  <div class="stack" style="margin-top:var(--space-3)">
    <div class="card-soft reveal" style="padding:var(--space-4)">
      <p style="font-weight:600">A soft card</p>
      <p class="quiet">Hairline border and soft shadow, together. Text at ink. Focus ring independent.</p>
      <button>focus me</button>
    </div>
  </div>
  <script>document.documentElement.classList.add('js');
    const io = new IntersectionObserver(es => es.forEach(e => e.isIntersecting && e.target.classList.add('in')), { threshold: 0.2 });
    document.querySelectorAll('.reveal').forEach(el => io.observe(el));
    setTimeout(() => document.querySelector('.eq').setAttribute('data-idle',''), 2600);
  </script>
</main>
</body>
</html>
